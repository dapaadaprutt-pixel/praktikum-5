
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JavaScript</title>
</head>
<body>
    <h1>Pengenalan JavaScript</h1>
    <p id="pesan">Konten awal.</p>

<h3>Cek Bilangan Genap atau Ganjil</h3>

<label for="bilangan">Masukkan bilangan bulat:</label>
<input type="number" id="bilangan" step="1">

<button type="button" onclick="cekBilangan()">Periksa</button>

<p id="hasilBilangan"></p>

<h3>Mengubah Warna Halaman</h3>

<button type="button" onclick="ubahWarnaLatar('lightgreen')">
    Latar Hijau
</button>

<button type="button" onclick="ubahWarnaLatar('white')">
    Latar Putih
</button>

<button type="button" onclick="ubahWarnaLatar('lightyellow')">
    Latar Kuning
</button>

<h3>Daftar Menu Makanan</h3>

<label>
    <input type="checkbox" class="menu" value="5000">
    Ayam Goreng — Rp5.000
</label>
<br>

<label>
    <input type="checkbox" class="menu" value="500">
    Tempe — Rp500
</label>
<br>

<label>
    <input type="checkbox" class="menu" value="2500">
    Telur Dadar — Rp2.500
</label>
<br>

<br>
<label>
    <input type="checkbox" class="menu" value="3000">
    Nasi Goreng — Rp3.000
</label>
<br>

<label>
    <input type="checkbox" class="menu" value="2000">
    Es Teh — Rp2.000
</label>
<br>

<p>Total: Rp<span id="total">0</span></p>

<hr>
<h2>Mini Project: Kalkulator Nilai Mahasiswa</h2>

<form id="formNilai">
    <label for="tugas">Nilai Tugas (0–100):</label>
    <input type="number" id="tugas" min="0" max="100" required>
    <br><br>

    <label for="uts">Nilai UTS (0–100):</label>
    <input type="number" id="uts" min="0" max="100" required>
    <br><br>

    <label for="uas">Nilai UAS (0–100):</label>
    <input type="number" id="uas" min="0" max="100" required>
    <br><br>

    <button type="submit">Hitung Nilai</button>
</form>

<div id="hasilNilai"></div>

<hr>
<h3>Eksperimen Validasi Form</h3>

<form id="formValidasi">
    <label for="namaValidasi">Nama:</label>
    <input type="text" id="namaValidasi" placeholder="Masukkan nama">

    <button type="submit">Periksa</button>
</form>

<p id="hasilValidasi"></p>

<hr>
<h3>Eksperimen Tampilkan dan Sembunyikan</h3>

<p id="teksRahasia">Ini adalah teks yang bisa disembunyikan.</p>

<button type="button" onclick="toggleTeks()">
    Sembunyikan / Tampilkan
</button>

    <script src="script.js"></script>
</body>
</html>
